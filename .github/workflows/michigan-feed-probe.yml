name: Probe Michigan county election feeds
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python senate_monitor/probe_michigan.py
      - name: Commit diagnostics only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add senate_monitor/michigan_diagnostics.json
          git diff --cached --quiet || (git commit -m "Update Michigan feed diagnostics" && git push)
