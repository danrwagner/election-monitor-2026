name: Probe public election feed
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: election-feed-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Check civicAPI response format
        run: python senate_monitor/probe_feed.py
      - name: Save non-sensitive diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add senate_monitor/feed_diagnostics.json
          if ! git diff --cached --quiet; then
            git commit -m "Record civicAPI feed probe"
            git push
          fi
